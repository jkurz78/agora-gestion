services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
    mysql:
        # MariaDB et non MySQL : c'est le moteur de la PRODUCTION (O2Switch).
        # Avant le 2026-10-03 ce service tournait en mysql:8.4, ce qui a produit
        # deux classes de pannes — des bugs révélés seulement en production
        # (identifiant inconnu lu comme un littéral, DATE_FORMAT refusé dans une
        # colonne générée), et l'impossibilité d'importer un dump de production,
        # MariaDB exportant les colonnes générées que MySQL refuse en entrée.
        #
        # Le service garde le nom `mysql` : le renommer toucherait DB_HOST, les
        # configurations de test et toutes les commandes `docker compose exec`.
        image: 'mariadb:11.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mariadb:/var/lib/mysql'
            - './docker/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mariadb-admin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    # L'ancien volume `sail-mysql` est conservé volontairement : les fichiers de
    # données MySQL sont illisibles par MariaDB, mais les garder rend la bascule
    # réversible — il suffit de remettre l'image et le volume d'origine.
    sail-mysql:
        driver: local
    sail-mariadb:
        driver: local
